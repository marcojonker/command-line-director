name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          model: mistral/mistral-small-latest
          agent: reviewer
          prompt:  |
            Review this pull request using the review agent's instructions.

            Follow the exact output format defined in the agent, including:
            - Severity and title
            - Filename and line numbers
            - Problem, impact, and suggested fix
            - Final verdict and finding counts

            Do not return a generic summary. Do not invent filenames or
            line numbers. If there are no actionable findings, say so.