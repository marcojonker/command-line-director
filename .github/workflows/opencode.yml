name: OpenCode AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Cancel an older review when a new commit arrives.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review

    # This version is configured for PRs from the same repository.
    # See the fork PR note below.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:

      # --------------------------------------------------
      # 1. Checkout the actual PR commit
      # --------------------------------------------------

      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # --------------------------------------------------
      # 2. Install OpenCode
      # --------------------------------------------------

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 3. Retrieve PR diff and metadata
      # --------------------------------------------------

      - name: Prepare review context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p .review

          gh pr diff "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            > .review/pr.diff

          if [ ! -s .review/pr.diff ]; then
            echo "Pull request diff is empty or unavailable."
            exit 1
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg head "$PR_HEAD_SHA" \
            --arg base "$PR_BASE_SHA" \
            --arg author "$PR_AUTHOR" \
            '{
              repository: $repository,
              pull_request: ($number | tonumber),
              title: $title,
              head_sha: $head,
              base_sha: $base,
              author: $author
            }' > .review/pr-metadata.json

          echo "PR diff prepared successfully."

      # --------------------------------------------------
      # 4. Run the OpenCode review agent
      # --------------------------------------------------

      - name: Run OpenCode code reviewer
        timeout-minutes: 15
        env:
          API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          PROMPT=$(cat <<'EOF'
          Perform a complete review of this GitHub pull request.

          Follow all instructions in the code-reviewer agent.

          Inspect every changed file and relevant surrounding code.

          Use the attached PR diff as the source of truth.

          Generate the complete machine-readable review at:
          .review/findings.json

          Do not modify application source files.
          Do not publish GitHub comments yourself.

          The GitHub Actions workflow will publish the findings.

          Make sure the JSON is complete and valid.
          EOF
          )

          opencode run "$PROMPT" \
            --agent reviewer \
            --model "mistral/mistral-small-latest" \
            --file .review/pr.diff \
            --file .review/pr-metadata.json

      # --------------------------------------------------
      # 5. Validate the agent output
      # --------------------------------------------------

      - name: Validate review JSON
        shell: bash
        run: |
            if [ ! -f .review/findings.json ]; then
                echo "::error::Review findings file was not created"
                exit 1
            fi

            echo "Checking JSON..."

            if ! jq empty .review/findings.json; then
                echo "::error::Invalid JSON generated by OpenCode"
                echo "Showing file around line 32:"
                nl -ba .review/findings.json | sed -n '25,40p'
                exit 1
            fi

            echo "JSON is valid"

      # --------------------------------------------------
      # 6. Publish native GitHub inline suggestions
      # --------------------------------------------------

      - name: Publish GitHub inline review
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: .review/findings.json
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');

            const review = JSON.parse(
              fs.readFileSync(process.env.REVIEW_FILE, 'utf8')
            );

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            // Verify that the PR has not changed while reviewing.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed(
                'PR changed during review. A new review is required.'
              );
              return;
            }

            // Retrieve changed files and their actual diff hunks.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100
              }
            );

            // Build valid RIGHT-side line references from each diff.
            const validLines = new Map();

            for (const file of files) {
              const lines = new Set();

              if (file.patch) {
                let newLine = null;

                for (const diffLine of file.patch.split('\n')) {
                  const hunk = diffLine.match(
                    /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/
                  );

                  if (hunk) {
                    newLine = Number(hunk[1]);
                    continue;
                  }

                  if (newLine === null) continue;

                  if (diffLine.startsWith('+') &&
                      !diffLine.startsWith('+++')) {
                    lines.add(newLine);
                    newLine++;
                  } else if (diffLine.startsWith(' ') ) {
                    lines.add(newLine);
                    newLine++;
                  } else if (
                    diffLine.startsWith('-') &&
                    !diffLine.startsWith('---')
                  ) {
                    // Deleted lines do not advance RIGHT-side lines.
                  }
                }
              }

              validLines.set(file.filename, lines);
            }

            // Convert findings into GitHub review comments.
            const comments = [];

            for (const finding of review.findings) {
              const fileLines = validLines.get(finding.path);

              if (!fileLines) {
                throw new Error(
                  `Finding references a file outside the PR diff: ${finding.path}`
                );
              }

              const line = finding.line;
              const startLine = finding.start_line ?? line;

              if (
                !fileLines.has(line) ||
                !fileLines.has(startLine) ||
                startLine > line
              ) {
                throw new Error(
                  `Invalid PR diff line reference: ${finding.path}:${line}`
                );
              }

              const comment = {
                path: finding.path,
                line,
                side: 'RIGHT',
                body: finding.body
              };

              if (startLine !== line) {
                comment.start_line = startLine;
                comment.start_side = 'RIGHT';
              }

              comments.push(comment);
            }

            // Count findings by severity.
            const counts = {
              CRITICAL: 0,
              HIGH: 0,
              MEDIUM: 0,
              LOW: 0
            };

            for (const finding of review.findings) {
              counts[finding.severity]++;
            }

            // Build the general PR review summary.
            const summary = [
              `## ${review.compliment}`,
              '',
              review.joke,
              '',
              '## Review Summary',
              '',
              review.summary,
              '',
              `**Verdict:** ${review.verdict}`,
              '',
              '### Findings',
              '',
              `- CRITICAL: ${counts.CRITICAL}`,
              `- HIGH: ${counts.HIGH}`,
              `- MEDIUM: ${counts.MEDIUM}`,
              `- LOW: ${counts.LOW}`,
              `- TOTAL: ${review.findings.length}`,
              '',
              '---',
              '',
              'Individual findings are attached to the relevant code lines.'
            ].join('\n');

            // Publish everything as one GitHub review.
            // APPROVE verdicts use COMMENT to avoid automatically
            // approving a PR without a human decision.
            const event =
              review.verdict === 'REQUEST_CHANGES'
                ? 'REQUEST_CHANGES'
                : 'COMMENT';

            const result = await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              commit_id: pr.head.sha,
              body: summary,
              event,
              comments
            });

            core.info(
              `Review published: ${result.data.html_url}`
            );

            core.info(
              `Inline comments published: ${comments.length}`
            );
