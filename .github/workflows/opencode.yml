name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          model: mistral/mistral-small-latest
          agent: reviewer
          prompt: |
            Review this pull request using the review agent's instructions.
            Follow its required findings format, including filenames, line
            numbers, severity, problem, impact, and suggested fix.