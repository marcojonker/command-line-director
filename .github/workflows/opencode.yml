name: OpenCode AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# Cancel an older review when a new commit arrives.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI Code Review

    # This version is configured for PRs from the same repository.
    # Fork PRs are intentionally excluded because this workflow uses a repository secret.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      # --------------------------------------------------
      # 1. Checkout the actual PR commit
      # --------------------------------------------------

      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # --------------------------------------------------
      # 2. Install OpenCode
      # --------------------------------------------------

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 3. Verify the structured JSON writer is present
      # --------------------------------------------------

      - name: Verify structured review writer
        shell: bash
        run: |
          if [ ! -f .opencode/tools/save_review.ts ]; then
            echo "::error::.opencode/tools/save_review.ts is missing"
            echo "Add the dedicated save_review custom tool to the repository."
            exit 1
          fi

          echo "Structured review writer found."

      # --------------------------------------------------
      # 4. Retrieve PR diff and metadata
      # --------------------------------------------------

      - name: Prepare review context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p .review

          gh pr diff "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            > .review/pr.diff

          if [ ! -s .review/pr.diff ]; then
            echo "Pull request diff is empty or unavailable."
            exit 1
          fi

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg head "$PR_HEAD_SHA" \
            --arg base "$PR_BASE_SHA" \
            --arg author "$PR_AUTHOR" \
            '{
              repository: $repository,
              pull_request: ($number | tonumber),
              title: $title,
              head_sha: $head,
              base_sha: $base,
              author: $author
            }' > .review/pr-metadata.json

          echo "PR diff prepared successfully."

      # --------------------------------------------------
      # 5. Run the OpenCode review agent
      # --------------------------------------------------

      - name: Run OpenCode code reviewer
        timeout-minutes: 15
        env:
          API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        shell: bash
        run: |
          PROMPT=$(cat <<'EOF'
          Perform a complete review of this GitHub pull request.

          Follow all instructions in the reviewer agent.

          Inspect every changed file and relevant surrounding code.
          Use the attached PR diff as the source of truth.

          Construct the complete review as structured data and save it
          by calling the save_review custom tool.

          Do not use built-in file-writing tools to create findings.json.
          Do not manually construct JSON.
          Do not use shell commands for serialization.
          If save_review is unavailable or fails, report the failure.
          Never claim that the findings file was saved unless the tool
          confirms success.

          Do not modify application source files.
          Do not publish GitHub comments yourself.
          The GitHub Actions workflow will publish the findings.
          EOF
          )

          opencode run "$PROMPT" \
            --agent reviewer \
            --model "mistral/mistral-small-latest" \
            --file .review/pr.diff \
            --file .review/pr-metadata.json

      # --------------------------------------------------
      # 6. Upload findings for diagnosis, even on failure
      # --------------------------------------------------

      - name: Upload review findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-findings
          path: .review/findings.json
          if-no-files-found: warn

      # --------------------------------------------------
      # 7. Validate strict JSON schema and review semantics
      # --------------------------------------------------

      - name: Validate review JSON
        shell: bash
        run: |
          set -euo pipefail

          FILE=".review/findings.json"

          if [ ! -f "$FILE" ]; then
            echo "::error::Review findings file was not created"
            exit 1
          fi

          echo "Checking JSON syntax and schema..."

          jq -e '
            def has_exact_keys($expected):
              (keys | sort) == ($expected | sort);

            type == "object"
            and has_exact_keys([
              "summary",
              "compliment",
              "joke",
              "verdict",
              "findings"
            ])
            and (.summary | type == "string")
            and (.compliment | type == "string")
            and (.joke | type == "string")
            and (.verdict == "APPROVE" or .verdict == "REQUEST_CHANGES")
            and (.findings | type == "array")
            and (
              .findings
              | all(.[];
                  type == "object"
                  and has_exact_keys([
                    "severity",
                    "path",
                    "line",
                    "start_line",
                    "category",
                    "confidence",
                    "title",
                    "body_lines"
                  ])
                  and (
                    .severity == "CRITICAL"
                    or .severity == "HIGH"
                    or .severity == "MEDIUM"
                    or .severity == "LOW"
                  )
                  and (
                    .path
                    | type == "string"
                    and length > 0
                    and (startswith("/") | not)
                    and (split("/") | index("..") == null)
                  )
                  and (
                    .line
                    | type == "number"
                    and floor == .
                    and . > 0
                  )
                  and (
                    .start_line
                    | type == "number"
                    and floor == .
                    and . > 0
                  )
                  and (.start_line <= .line)
                  and (
                    .category == "Bug"
                    or .category == "Security"
                    or .category == "Performance"
                    or .category == "Maintainability"
                  )
                  and (
                    .confidence == "High"
                    or .confidence == "Medium"
                    or .confidence == "Low"
                  )
                  and (.title | type == "string" and length > 0)
                  and (
                    .body_lines
                    | type == "array"
                    and length > 0
                    and all(.[];
                      type == "string"
                      and (contains("\n") | not)
                      and (contains("\r") | not)
                    )
                  )
                )
            )
            and (
              .verdict ==
              (
                if any(
                  .findings[];
                  .severity == "CRITICAL" or .severity == "HIGH"
                )
                then "REQUEST_CHANGES"
                else "APPROVE"
                end
              )
            )
          ' "$FILE" > /dev/null

          echo "JSON syntax, schema and verdict validation passed."

      # --------------------------------------------------
      # 8. Publish native GitHub inline suggestions
      # --------------------------------------------------

      - name: Publish GitHub inline review
        uses: actions/github-script@v7
        env:
          REVIEW_FILE: .review/findings.json
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');

            const review = JSON.parse(
              fs.readFileSync(process.env.REVIEW_FILE, 'utf8')
            );

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.issue.number;

            // Verify that the PR has not changed while reviewing.
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number
            });

            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.setFailed(
                'PR changed during review. A new review is required.'
              );
              return;
            }

            // Retrieve changed files and their actual diff hunks.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number,
                per_page: 100
              }
            );

            // Build valid RIGHT-side line references from each diff.
            const validLines = new Map();

            for (const file of files) {
              const lines = new Set();

              if (file.patch) {
                let newLine = null;

                for (const diffLine of file.patch.split('\n')) {
                  const hunk = diffLine.match(
                    /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/
                  );

                  if (hunk) {
                    newLine = Number(hunk[1]);
                    continue;
                  }

                  if (newLine === null) continue;

                  if (
                    diffLine.startsWith('+') &&
                    !diffLine.startsWith('+++')
                  ) {
                    lines.add(newLine);
                    newLine++;
                  } else if (diffLine.startsWith(' ')) {
                    lines.add(newLine);
                    newLine++;
                  } else if (
                    diffLine.startsWith('-') &&
                    !diffLine.startsWith('---')
                  ) {
                    // Deleted lines do not advance RIGHT-side lines.
                  }
                }
              }

              validLines.set(file.filename, lines);
            }

            // Convert findings into GitHub review comments.
            const comments = [];

            for (const finding of review.findings) {
              const fileLines = validLines.get(finding.path);

              if (!fileLines) {
                throw new Error(
                  `Finding references a file outside the PR diff: ${finding.path}`
                );
              }

              const line = finding.line;
              const startLine = finding.start_line;

              if (
                !fileLines.has(line) ||
                !fileLines.has(startLine) ||
                startLine > line
              ) {
                throw new Error(
                  `Invalid PR diff line reference: ${finding.path}:${line}`
                );
              }

              const comment = {
                path: finding.path,
                line,
                side: 'RIGHT',
                body: finding.body_lines.join('\n')
              };

              if (startLine !== line) {
                comment.start_line = startLine;
                comment.start_side = 'RIGHT';
              }

              comments.push(comment);
            }

            // Count findings by severity.
            const counts = {
              CRITICAL: 0,
              HIGH: 0,
              MEDIUM: 0,
              LOW: 0
            };

            for (const finding of review.findings) {
              counts[finding.severity]++;
            }

            // Build the general PR review summary.
            const summary = [
              `## ${review.compliment}`,
              '',
              review.joke,
              '',
              '## Review Summary',
              '',
              review.summary,
              '',
              `**Verdict:** ${review.verdict}`,
              '',
              '### Findings',
              '',
              `- CRITICAL: ${counts.CRITICAL}`,
              `- HIGH: ${counts.HIGH}`,
              `- MEDIUM: ${counts.MEDIUM}`,
              `- LOW: ${counts.LOW}`,
              `- TOTAL: ${review.findings.length}`,
              '',
              '---',
              '',
              'Individual findings are attached to the relevant code lines.'
            ].join('\n');

            // APPROVE verdicts use COMMENT to avoid automatically
            // approving a PR without a human decision.
            const event =
              review.verdict === 'REQUEST_CHANGES'
                ? 'REQUEST_CHANGES'
                : 'COMMENT';

            const result = await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number,
              commit_id: pr.head.sha,
              body: summary,
              event,
              comments
            });

            core.info(
              `Review published: ${result.data.html_url}`
            );

            core.info(
              `Inline comments published: ${comments.length}`
            );
